async function submit(event){

function pauseWorkout(){if(!workout)return;workout.running=false;clearInterval(workoutInterval);const b=modal.querySelector('[data-action="workout-pause"]');if(b)b.innerHTML=icon('play',15)+' Reanudar';}
function workoutMarkup(){const b=workout.plan.blocks[workout.index];return modalHTML(workout.plan.title,`<div class="timer-box"><span class="badge" id="workout-step">${workout.index+1}/${workout.plan.blocks.length}</span><h3 id="workout-name" class="mt-sm">${b.name}</h3><div class="timer-display" id="workout-time">${timerLabel(workout.remaining)}</div><p class="small muted" id="workout-instruction">${b.instruction}</p><div class="actions"><button class="btn primary" data-action="workout-pause">${icon('pause',15)} Pausar</button><button class="btn ghost" data-action="workout-next">Siguiente</button></div></div><p class="tiny muted mt">El temporizador guía la sesión. Guarda únicamente los minutos que realizaste. Se pausa al ocultar la página o cerrar esta ventana.</p><div class="actions"><button class="btn ghost" data-action="workout-record">Terminar y registrar</button></div>`);}
function timerLabel(seconds){const s=Math.ceil(Math.max(0,seconds));return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;}
function startWorkout(date){const ctx=context(),plan=trainingWeek(ctx.p,date).find(d=>d.date===date)?.session||sessionFor(ctx.p,0);if(!plan)throw new Error('Completa tu perfil antes de comenzar una sesión guiada.');pauseWorkout();workout={plan,index:0,remaining:plan.blocks[0].seconds,elapsed:0,running:true,lastTick:Date.now(),date};openModal(workoutMarkup());resumeWorkout();}
function resumeWorkout(){if(!workout)return;workout.running=true;workout.lastTick=Date.now();const b=modal.querySelector('[data-action="workout-pause"]');if(b)b.innerHTML=icon('pause',15)+' Pausar';clearInterval(workoutInterval);workoutInterval=setInterval(()=>{if(!workout.running)return;const now=Date.now(),delta=Math.min((now-workout.lastTick)/1000,3);workout.lastTick=now;workout.elapsed+=delta;workout.remaining-=delta;if(workout.remaining<=0){advanceWorkout();return;}const el=document.getElementById('workout-time');if(el)el.textContent=timerLabel(workout.remaining);},250);}
function advanceWorkout(){if(!workout)return;if(workout.index>=workout.plan.blocks.length-1){pauseWorkout();openModal(modalHTML('Tu sesión guiada terminó',`<p class="modal-description">Tómate un momento para recuperar. El temporizador estuvo activo ${fmt(workout.elapsed/60,1)} minutos. Puedes registrar los minutos que realizaste.</p><div class="actions"><button class="btn primary" data-action="workout-record">Registrar mi entrenamiento</button><button class="btn ghost" data-action="close-modal">Cerrar</button></div>`));return;}const running=workout.running;workout.index++;workout.remaining=workout.plan.blocks[workout.index].seconds;openModal(workoutMarkup());if(running)resumeWorkout();else pauseWorkout();}
function stopBreathing(show=false){clearInterval(breathTimer);breathTimer=null;const el=document.getElementById('breathing-orb');if(el){el.className='breathing-orb';el.textContent='Tu pausa';}if(show){const status=document.getElementById('breathing-status');if(status)status.textContent='Pausa detenida. Respira a tu ritmo.';}}
function startBreathing(){stopBreathing();const date=ui.date;let elapsed=0;const orb=document.getElementById('breathing-orb'),status=document.getElementById('breathing-status');if(!orb)return;const draw=()=>{const inhale=elapsed%10<4;orb.className=`breathing-orb ${inhale?'inhale':'exhale'}`;orb.textContent=inhale?'Inhala suave':'Exhala suave';status.textContent=`${60-elapsed} segundos · Sin retener el aire`;};draw();breathTimer=setInterval(()=>{elapsed++;if(elapsed>=60){stopBreathing();store.put('relaxation',{minutes:1,type:'Pausa de respiración'},{date,id:`relaxation:${date}:breathing`});render();toast('Tu pausa quedó registrada.');return;}draw();},1000);}
async function changed(event){try{const el=event.target;if(el.matches('[data-date-select]')){ui.date=ensureDate(el.value);ui.sessionDate=null;ui.moodPreset=null;render();}else if(el.dataset.setting){changeSetting(el.dataset.setting,el.checked);updateStatus();}else if(el.dataset.shoppingKey){const key=el.dataset.shoppingKey,id='shopping:'+Array.from(new TextEncoder().encode(key)).map(x=>x.toString(16).padStart(2,'0')).join('').slice(0,105);store.put('shopping',{item:key,checked:el.checked},{id});render();}else if(el.id==='import-file'&&el.files?.[0]){const file=el.files[0];if(file.size>25_000_000)throw new Error('El respaldo supera el tamaño admitido.');const snapshot=JSON.parse(await file.text());if(await ask('Importar respaldo privado','Se combinará el historial de este archivo con tu espacio actual. Verifica que pertenece a la misma persona.')){const count=store.import(snapshot);render();toast(`${count} registros restaurados.`);}}}catch(e){toast(e.message,true);}}
function tick(){try{const today=localDate();if(today!==ui.lastToday){ui.lastToday=today;ui.date=today;if(!isEditing())render();}const ctx=context(),s=ctx.settings;if(s.reminders&&Date.now()-ui.lastReminder>=s.reminderInterval*60000){const now=new Date(),time=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;if(time>=s.reminderStart&&time<=s.reminderEnd&&totals(store.records,today,ctx.p,s).water<s.waterGoal){ui.lastReminder=Date.now();toast('Un momento para tomar agua, si lo necesitas.');if('Notification' in window&&Notification.permission==='granted'){new Notification('VIVE+ · Tu pausa',{body:'¿Te gustaría tomar un poco de agua?',icon:'./assets/icon-192.png',tag:'vive-hydration'});}}}}catch{/* Optional notifications must never interrupt logging. */}}
async function boot(){
 try{store=new Store();cloud=new CloudClient(window.VIVE_CONFIG||{});store.load(cloud.user?.id||'guest');store.subscribe(afterChange);
  document.addEventListener('click',action);document.addEventListener('submit',submit);document.addEventListener('change',changed);modal.addEventListener('cancel',()=>{if(confirmResolve){confirmResolve(false);confirmResolve=null;}pauseWorkout();});modal.addEventListener('click',e=>{if(e.target===modal)closeModal();});
  window.addEventListener('hashchange',route);window.addEventListener('storage',e=>{if(e.key===store.key){try{store.reloadExternal();if(!isEditing())render();}catch(err){toast(err.message,true);}}});
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;});window.addEventListener('online',()=>sync());document.addEventListener('visibilitychange',()=>{if(document.hidden){pauseWorkout();stopBreathing(true);}else{tick();sync();}});
  if(cloud.configured&&location.hash.includes('access_token=')){const callbackHash=location.hash;history.replaceState(null,'',location.pathname+location.search);await cloud.acceptCallback(callbackHash);await switchAccount();location.hash='/account';if(cloud.recovery)toast('Enlace verificado. Cambia tu contraseña en Mi cuenta.');}
  route();setInterval(tick,30000);setInterval(()=>sync(),60000);
  if(cloud.user){try{await cloud.validateSession();await switchAccount();}catch(e){toast(e.message,true);if(!cloud.user)await switchAccount();}}
  if('serviceWorker' in navigator&&location.protocol!=='file:'){navigator.serviceWorker.register('./service-worker.js').catch(()=>toast('El modo sin conexión no pudo activarse. Los registros locales siguen funcionando.'));}
 }catch(e){app.innerHTML=`<main class="boot"><span class="brand">VIVE<span>+</span></span><h2 class="mt">Necesitamos recuperar tu espacio</h2><p>${esc(e.message)}</p><p class="small muted">No se borró ningún respaldo. Revisa el almacenamiento del navegador o la configuración antes de continuar.</p></main>`;}
}
boot();

return {  };
})();

</script>
